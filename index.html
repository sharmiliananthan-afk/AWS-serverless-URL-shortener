<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URL Shortener — AWS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: #1e293b;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 28px;
      font-weight: 700;
      color: #38bdf8;
    }

    .logo p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
    }

    .badge {
      display: inline-block;
      background: #0ea5e9;
      color: white;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 99px;
      margin-top: 8px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    input::placeholder {
      color: #475569;
    }

    button {
      padding: 12px 20px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    button:hover { background: #0284c7; }
    button:disabled { background: #334155; cursor: not-allowed; }

    .result {
      display: none;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .result.show { display: block; }

    .result-label {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .result-url {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .result-url a {
      color: #38bdf8;
      font-size: 14px;
      text-decoration: none;
      word-break: break-all;
      flex: 1;
    }

    .result-url a:hover { text-decoration: underline; }

    .copy-btn {
      padding: 6px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #94a3b8;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .copy-btn:hover { background: #334155; color: white; }

    .error {
      display: none;
      background: #450a0a;
      border: 1px solid #dc2626;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 20px;
    }

    .error.show { display: block; }

    .stats {
      text-align: center;
      font-size: 12px;
      color: #475569;
      padding-top: 20px;
      border-top: 1px solid #1e293b;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ffffff40;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .aws-badge {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo">
      <h1>⚡ URL Shortener</h1>
      <p>Serverless URL shortening powered by AWS</p>
      <span class="badge">Built on AWS Lambda + DynamoDB</span>
    </div>

    <div class="input-group">
      <input 
        type="url" 
        id="urlInput" 
        placeholder="Paste your long URL here..."
      />
      <button id="shortenBtn" onclick="shortenUrl()">Shorten</button>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="result" id="resultBox">
      <div class="result-label">✅ Your short URL is ready!</div>
      <div class="result-url">
        <a id="shortUrlLink" href="#" target="_blank"></a>
        <button class="copy-btn" onclick="copyUrl()">Copy</button>
      </div>
    </div>

    <div class="stats">
      Paste any URL and get a short link instantly
    </div>

    <div class="aws-badge">
      ☁️ Powered by AWS Lambda · DynamoDB · API Gateway
    </div>

  </div>

  <script>
    const API_URL = 'https://73g99fcssc.execute-api.us-east-1.amazonaws.com/prod';

    async function shortenUrl() {
      const input = document.getElementById('urlInput');
      const btn = document.getElementById('shortenBtn');
      const resultBox = document.getElementById('resultBox');
      const errorBox = document.getElementById('errorBox');
      const shortUrlLink = document.getElementById('shortUrlLink');

      const url = input.value.trim();

      // Hide previous results
      resultBox.classList.remove('show');
      errorBox.classList.remove('show');

      // Validate
      if (!url) {
        errorBox.textContent = 'Please enter a URL!';
        errorBox.classList.add('show');
        return;
      }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        errorBox.textContent = 'Please include http:// or https:// in your URL';
        errorBox.classList.add('show');
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span>Shortening...';

      try {
        const response = await fetch(`${API_URL}/shorten`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (response.ok) {
          const shortUrl = `${API_URL}/${data.shortCode}`;
          shortUrlLink.href = shortUrl;
          shortUrlLink.textContent = shortUrl;
          resultBox.classList.add('show');
        } else {
          errorBox.textContent = data.error || 'Something went wrong!';
          errorBox.classList.add('show');
        }

      } catch (err) {
        errorBox.textContent = 'Network error — please try again!';
        errorBox.classList.add('show');
      }

      // Reset button
      btn.disabled = false;
      btn.innerHTML = 'Shorten';
    }

    function copyUrl() {
      const url = document.getElementById('shortUrlLink').textContent;
      navigator.clipboard.writeText(url);
      const btn = event.target;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 2000);
    }

    // Allow Enter key
    document.getElementById('urlInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') shortenUrl();
    });
  </script>

</body>
</html>
